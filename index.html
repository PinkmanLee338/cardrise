<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MT卡牌崛起 · 我叫MT式卡牌手游</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#17102a;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#f2ead8}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{user-select:text;-webkit-user-select:text}
::-webkit-scrollbar{width:0;height:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#241a45 0%,#17102a 60%,#120c22 100%)}
/* ---------- 顶栏 ---------- */
#topbar{height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:7px;padding-left:9px;padding-right:9px;background:linear-gradient(180deg,#3a2a63,#241a45);border-bottom:2px solid #0d0820;z-index:30;flex:none}
#avatarBox{width:40px;height:40px;border-radius:9px;border:2px solid #ffd100;overflow:hidden;background:#4a3a7a;flex:none;position:relative}
#avatarBox canvas{width:100%;height:100%}
#accInfo{flex:none;width:86px}
#accInfo .nm{font-size:13px;font-weight:800;color:#ffe9a8;white-space:nowrap;overflow:hidden}
#accInfo .lv{font-size:10.5px;color:#b9aee0}
#accXpBar{height:5px;background:#120c22;border-radius:3px;margin-top:2px;overflow:hidden}
#accXpBar i{display:block;height:100%;background:linear-gradient(90deg,#9d4dff,#e6c8ff)}
.res{flex:1;display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.35);border-radius:13px;padding:4px 8px;font-size:12.5px;font-weight:700;min-width:0}
.res .ic{font-size:13px}
.res .vl{color:#ffe9a8;white-space:nowrap}
.res .plus{margin-left:auto;width:17px;height:17px;border-radius:50%;background:linear-gradient(180deg,#7ddb4a,#4a9e26);color:#fff;font-weight:900;font-size:13px;line-height:15px;text-align:center;flex:none}
.res.stam .vl{color:#aef29a}
/* ---------- 主区域 ---------- */
#main{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
.screen{display:none;padding:12px 12px 20px;animation:fadeIn .22s}
.screen.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- 底栏 ---------- */
#navbar{height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:linear-gradient(180deg,#2c2050,#1a1233);border-top:2px solid #0d0820;z-index:30;flex:none}
.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:#9d92c4;position:relative}
.navBtn .ic{font-size:22px;line-height:1.1;filter:grayscale(.6);opacity:.75}
.navBtn.on{color:#ffd100}.navBtn.on .ic{filter:none;opacity:1;transform:scale(1.12)}
.navBtn .bdg{position:absolute;top:5px;right:calc(50% - 19px);background:#e83a2a;color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;line-height:15px;text-align:center;font-weight:800;padding:0 3px}
/* ---------- 通用组件 ---------- */
.btn{display:inline-block;background:linear-gradient(180deg,#ffb62e,#f08c0a);border:1.5px solid #ffe1a0;color:#5a2d00;border-radius:10px;padding:9px 20px;font-size:15px;font-weight:900;letter-spacing:1px;box-shadow:0 3px 0 #a85e00,0 5px 12px rgba(0,0,0,.4);text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a85e00}
.btn:disabled{filter:grayscale(.85);opacity:.55;box-shadow:none}
.btn.blue{background:linear-gradient(180deg,#4ab8ff,#1c78d8);border-color:#bfe6ff;color:#fff;box-shadow:0 3px 0 #0f4d94,0 5px 12px rgba(0,0,0,.4)}
.btn.green{background:linear-gradient(180deg,#7ddb4a,#4a9e26);border-color:#d2ffb8;color:#fff;box-shadow:0 3px 0 #2f6b14,0 5px 12px rgba(0,0,0,.4)}
.btn.purple{background:linear-gradient(180deg,#b45eff,#7d2ae0);border-color:#e2c2ff;color:#fff;box-shadow:0 3px 0 #4c148f,0 5px 12px rgba(0,0,0,.4)}
.btn.gray{background:linear-gradient(180deg,#5a5f73,#3a3f4f);border-color:#9aa0b5;color:#dfe3ee;box-shadow:0 3px 0 #23262f}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:8px}
.card{background:linear-gradient(180deg,rgba(58,42,99,.85),rgba(32,22,60,.9));border:1.5px solid #57468a;border-radius:13px;padding:12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.secTitle{font-size:16px;font-weight:900;color:#ffe9a8;letter-spacing:1px;margin:4px 0 10px;display:flex;align-items:center;gap:7px}
.secTitle::before{content:'';width:4px;height:17px;background:linear-gradient(180deg,#ffd100,#f08c0a);border-radius:2px}
.dim{color:#9d92c4}.gold{color:#ffd100}.grn{color:#7ddb4a}.red{color:#ff7a6e}.blu{color:#6ac2ff}.pur{color:#c07dff}.org{color:#ff9d45}
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,2,14,.72);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modalBox{width:min(410px,96vw);max-height:86vh;overflow-y:auto;background:linear-gradient(180deg,#3a2a63,#211741);border:2px solid #8a6d2f;border-radius:15px;padding:16px;box-shadow:0 14px 44px rgba(0,0,0,.7);animation:pop .18s}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modalBox h3{color:#ffd100;font-size:17px;letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.modalBox h3 .x{color:#9d92c4;font-size:20px;padding:0 4px}
#toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);z-index:300;pointer-events:none;text-align:center;width:94vw}
#toast .big{display:inline-block;background:rgba(10,5,25,.88);border:1.5px solid #ffd100;color:#ffe9a8;font-size:16px;font-weight:800;padding:9px 22px;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
/* ---------- 英雄卡 ---------- */
.heroGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hcard{border-radius:12px;padding:6px 6px 7px;position:relative;cursor:pointer;border:2px solid #3a6fd8;background:linear-gradient(180deg,#2b3f6e,#1a2440);text-align:center;transition:transform .1s}
.hcard:active{transform:scale(.96)}
.hcard.r3{border-color:#a335ee;background:linear-gradient(180deg,#472a6e,#241640)}
.hcard.r4{border-color:#ff8000;background:linear-gradient(180deg,#6e4420,#33200e);box-shadow:0 0 14px rgba(255,128,0,.35)}
.hcard canvas{width:100%;aspect-ratio:1;border-radius:8px;display:block;background:radial-gradient(circle at 50% 32%,rgba(255,255,255,.16),transparent 70%)}
.hcard .nm{font-size:13px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden}
.hcard .meta{font-size:10.5px;color:#c9bfe8;display:flex;justify-content:space-between;padding:0 2px}
.hcard .stars{color:#ffd100;font-size:10px;letter-spacing:-1px}
.hcard .inTeam{position:absolute;top:4px;left:4px;background:#e83a2a;color:#fff;font-size:9.5px;font-weight:800;padding:1.5px 6px;border-radius:7px;z-index:2}
.hcard .shardTag{font-size:9.5px;color:#8affc1}
.hcard.notOwned{filter:grayscale(.85);opacity:.55}
/* ---------- 副本 ---------- */
.chapHead{display:flex;align-items:center;gap:10px;margin:14px 0 9px}
.chapHead .t{font-size:16.5px;font-weight:900;color:#ffe9a8}
.chapHead .stars{margin-left:auto;font-size:12.5px;color:#ffd100}
.stageGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.mapPanel{position:relative;height:350px;border-radius:16px;overflow:hidden;border:1.5px solid #57468a;margin-bottom:8px;box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.map-grass{background:linear-gradient(180deg,#7ec8f7 0%,#a8dcff 26%,#79c25e 27%,#4d8f3e 100%)}
.map-grave{background:linear-gradient(180deg,#1d1d38 0%,#2c2c52 30%,#3a3a5e 31%,#23233c 100%)}
.map-cave{background:linear-gradient(180deg,#2a0f0a 0%,#57200f 30%,#6e2f16 31%,#38160d 100%)}
.mapPanel.eliteMap{filter:hue-rotate(38deg) saturate(1.15)}
.mapTitle{position:absolute;left:12px;top:10px;z-index:3;color:#fff;font-weight:900;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.55)}
.mapTitle span{display:block;font-size:11px;font-weight:700;opacity:.92;margin-top:2px}
.mapPath{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.mapDeco{position:absolute;font-size:24px;z-index:1;opacity:.9;transform:translate(-50%,-50%)}
.mapNode{position:absolute;z-index:2;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:linear-gradient(180deg,#5d7dc9,#3a56a0);border:2.5px solid #dfe9ff;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.45);transition:transform .12s}
.mapNode:active{transform:scale(.92)}
.mapNode .mn{font-size:17px;font-weight:900}
.mapNode.cleared{background:linear-gradient(180deg,#57b368,#2f7d43);border-color:#c9f2d2}
.mapNode.current{background:linear-gradient(180deg,#ffb62e,#f08c0a);border-color:#ffe1a0;color:#5a2d00;animation:nodePulse 1.3s infinite}
.mapNode.boss{width:58px;height:58px;margin:-29px 0 0 -29px;background:linear-gradient(180deg,#c94f6d,#8e2438);border-color:#ffc9d4}
.mapNode.boss.cleared{background:linear-gradient(180deg,#57b368,#2f7d43)}
.mapNode.boss.current{background:linear-gradient(180deg,#ffb62e,#f08c0a);color:#5a2d00}
.mapNode.locked{background:linear-gradient(180deg,#555a6e,#333849);border-color:#8b93a8;color:#aab;cursor:default}
.mapNode .mstars{position:absolute;top:48px;left:50%;transform:translateX(-50%);font-size:10.5px;color:#ffd76a;text-shadow:0 1px 3px #000;white-space:nowrap}
.mapNode.boss .mstars{top:58px}
.mapNode .mname{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:9px;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;opacity:.9}
.mapNode .mboss{position:absolute;top:-9px;right:-14px;font-size:8.5px;background:#ff4757;color:#fff;border-radius:6px;padding:1px 4px;font-weight:900;box-shadow:0 2px 5px rgba(0,0,0,.4)}
@keyframes nodePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,182,46,.55),0 4px 10px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 9px rgba(255,182,46,0),0 4px 10px rgba(0,0,0,.45)}}
.chapChips{display:flex;gap:6px;margin-bottom:9px}
.chapChip{flex:1;background:#241a3f;border:1.5px solid #4a3a75;color:#cfc6f2;border-radius:10px;padding:6px 3px;font-size:11px;font-weight:800;cursor:pointer;line-height:1.45}
.chapChip.on{background:linear-gradient(180deg,#6a4fd0,#4c2fa3);color:#fff;border-color:#b79cff}
.chapChip.locked{opacity:.45}
.unit.windup .fig{filter:brightness(1.4)}
.unit.charging .fig{filter:brightness(1.3) drop-shadow(0 0 7px #ffd100)}
.unit.np.charging .unm{color:#ffd100}
.stageBtn{aspect-ratio:1;border-radius:12px;border:2px solid #57468a;background:linear-gradient(180deg,#33255e,#1f153f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;cursor:pointer}
.stageBtn .n{font-size:19px;font-weight:900;color:#ffe9a8}
.stageBtn .nm{font-size:9.5px;color:#b9aee0;text-align:center;line-height:1.25;padding:0 2px}
.stageBtn .st{font-size:10px;color:#ffd100;letter-spacing:-1px}
.stageBtn.locked{filter:grayscale(1);opacity:.45}
.stageBtn.boss{border-color:#e83a2a;background:linear-gradient(180deg,#5e2533,#2c1220)}
.stageBtn.elite{border-color:#a335ee}
.stageBtn:active{transform:scale(.95)}
.modeTabs{display:flex;gap:8px;margin-bottom:4px}
.modeTabs button{flex:1;padding:8px;border-radius:9px;font-size:14px;font-weight:800;background:#241a45;color:#9d92c4;border:1.5px solid #57468a}
.modeTabs button.on{background:linear-gradient(180deg,#ffb62e,#f08c0a);color:#5a2d00;border-color:#ffe1a0}
/* ---------- 战斗 ---------- */
#battleScr{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;background:#0c0718}
#battleScr.on{display:flex}
#btTop{padding:calc(6px + env(safe-area-inset-top)) 10px 6px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.4);z-index:5}
#btTop .ttl{font-weight:900;color:#ffe9a8;font-size:14.5px}
#btTop .spd{margin-left:auto;display:flex;gap:6px}
#btTop .spd button{background:rgba(255,255,255,.12);border:1px solid #57468a;color:#dfe6ff;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700}
#btTop .spd button.on{background:#f08c0a;color:#fff;border-color:#ffe1a0}
#btTop .plate{font-weight:900;font-size:13px;color:#fff;padding:5px 12px;border-radius:9px;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap}
#btTop .plate.blue{background:linear-gradient(180deg,#3a6ad8,#274b9e);border:1.5px solid #7ea4ff}
#btTop .plate.red{background:linear-gradient(180deg,#c8452c,#93301e);border:1.5px solid #ff9a7a}
#btTop .plate .dim{color:#ffd9c9;font-size:10.5px;font-weight:700;margin-left:5px}
#btTimer{margin:0 auto;font-weight:900;font-size:15px;color:#ffe9a8;background:rgba(0,0,0,.55);border:2px solid #8a7648;border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;flex:none}
#btTimer.hot{color:#ff8a7a;border-color:#c8452c}
#btStack{position:absolute;right:8px;top:35%;z-index:8;display:flex;flex-direction:column;gap:9px}
#btStack .stk{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,14,40,.72);color:#fff;font-size:12.5px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0}
#btStack .stk.on{border-color:#ffd100;color:#ffd100;box-shadow:0 0 12px rgba(255,209,0,.55)}
#btStack .stk:active{transform:scale(.93)}
#btCards{display:flex;gap:7px;justify-content:center;padding:7px 8px 4px;background:rgba(0,0,0,.4);z-index:5}
.btc{position:relative;width:19%;max-width:78px;border-radius:24px 24px 9px 9px;border:2.5px solid #b03a2e;background:linear-gradient(180deg,#3a2c50,#241a38);overflow:hidden;flex:none}
.btc.r1{border-color:#5aa2e8}.btc.r2{border-color:#b06ee8}.btc.r3{border-color:#f08c0a}
.btc canvas{width:100%;display:block}
.btc .stars{font-size:9px;color:#ffd100;text-align:center;line-height:1.3;text-shadow:0 1px 2px #000}
.btc .bhp,.btc .ben{height:5px;background:rgba(0,0,0,.7);margin:1.5px 4px;border-radius:3px;overflow:hidden}
.btc .bhp i{display:block;height:100%;background:linear-gradient(90deg,#58d93c,#8aff6a)}
.btc .ben i{display:block;height:100%;background:linear-gradient(90deg,#ffb62e,#ffd100)}
.btc .bhp{margin-bottom:4px}
.btc.ready{border-color:#ffd100;box-shadow:0 0 14px rgba(255,209,0,.85);animation:pulse .7s infinite alternate}
.btc.dead{filter:grayscale(1);opacity:.45}
.btc .bult{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:9px;font-weight:900;color:#ffe9a8;text-shadow:0 1px 3px #000,0 0 6px #000;opacity:0}
.btc.ready .bult{opacity:1}
#btStage.shake{animation:shk .32s}
@keyframes shk{0%,100%{transform:none}25%{transform:translate(3px,-2px)}55%{transform:translate(-3px,2px)}80%{transform:translate(2px,1px)}}
#battleScr #ultBanner canvas{width:116px;height:116px}
#battleScr #ultBanner .sk{font-size:33px;transform:rotate(-2deg)}
#btStage{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,#2c4a72 0%,#3a5f7a 34%,#4a7a4e 62%,#33512f 100%)}
#btStage.grave{background:linear-gradient(180deg,#1c1c34 0%,#2c2c4a 34%,#3d3d55 62%,#2a2a3c 100%)}
#btStage.cave{background:linear-gradient(180deg,#200f14 0%,#38181e 34%,#4a2620 62%,#2c1811 100%)}
#btGround{position:absolute;left:-10%;right:-10%;bottom:0;height:44%;background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.10),transparent 60%)}
.unit{position:absolute;width:76px;margin-left:-38px;text-align:center;transition:transform .12s;z-index:3}
.unit .fig{width:64px;height:64px;margin:0 auto;border-radius:10px;border:2px solid #d8d8de;overflow:hidden;background:rgba(0,0,0,.3);position:relative;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.unit .fig canvas{width:100%;height:100%}
.unit.foe .fig{border-color:#e83a2a}
.unit .fig.flip canvas{transform:scaleX(-1)}
.unit .bars{margin-top:2px}
.unit .hpbar,.unit .enbar{height:6px;border-radius:3px;background:rgba(0,0,0,.65);overflow:hidden;border:1px solid rgba(0,0,0,.8)}
.unit .hpbar i{display:block;height:100%;background:linear-gradient(90deg,#58d93c,#8aff6a);transition:width .25s}
.unit.foe .hpbar i{background:linear-gradient(90deg,#d93c3c,#ff7a6a)}
.unit .enbar{height:4px;margin-top:1.5px}
.unit .enbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb62e,#ffd100);transition:width .2s}
.unit .unm{font-size:10px;color:#fff;text-shadow:0 1px 3px #000,0 0 4px #000;font-weight:700;white-space:nowrap}
.unit .ulv{position:absolute;top:-5px;left:2px;background:rgba(0,0,0,.7);color:#ffd100;font-size:9px;font-weight:800;border-radius:6px;padding:0.5px 5px;z-index:2}
.unit.dead{filter:grayscale(1);opacity:.35;transform:rotate(8deg) translateY(8px)}
.unit.ultReady .fig{border-color:#ffd100;box-shadow:0 0 16px #ffd100,0 0 30px rgba(255,209,0,.5);animation:pulse .7s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.unit.stunned .fig::after{content:'💫';position:absolute;top:0;right:0;font-size:15px}
/* ===== 布局与交互优化 ===== */
.screen.on{animation:scrIn .28s ease both}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modalBox{animation:popIn .18s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
.btn:active{transform:scale(.95)}
.btn{transition:transform .08s,filter .15s}
.stageBtn{transition:transform .1s,box-shadow .15s}
.stageBtn:active{transform:scale(.93)}
.hcard{transition:transform .12s,box-shadow .15s}
.hcard:active{transform:scale(.96)}
.navBtn .ic{display:inline-block;transition:transform .18s}
.navBtn.on .ic{transform:translateY(-2px) scale(1.22)}
.navBtn{transition:color .15s}
.tslot{transition:transform .1s,border-color .15s}
.tslot:active{transform:scale(.95)}
#summonResults .hcard{animation:cardIn .38s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:rotateY(70deg) scale(.8)}to{opacity:1;transform:none}}
.chestBtn:active{transform:scale(.95)}
.rowItem .btn:active{transform:scale(.93)}
/* 3D 战斗名牌 */
#btStage canvas.g3cv{position:absolute;inset:0;z-index:0}
.unit{z-index:6}
.unit.np{width:66px;margin-left:-33px;background:none;pointer-events:auto}
.unit.np .unm{font-size:9px;text-shadow:0 1px 3px #000,0 0 6px #000}
.unit.np .ulv{font-size:9px}
.unit.np .bars{filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.unit.np.dead{opacity:.45}
.unit.np{transform:translateY(-100%)}
#ultFlash{z-index:5}
.unit.hitFx .fig{filter:brightness(1.8) saturate(.3)}
#ultFlash{position:absolute;inset:0;background:radial-gradient(circle,#fff8d0 0%,rgba(255,209,0,.25) 55%,transparent 80%);opacity:0;pointer-events:none;z-index:5}
@keyframes ultFlashA{0%{opacity:.55}100%{opacity:0}}
.hpbar.low i{background:linear-gradient(90deg,#ff5a4e,#ff9a3d);animation:lowPulse .7s infinite alternate}
@keyframes lowPulse{from{filter:brightness(.8)}to{filter:brightness(1.4)}}
.chestRow{display:flex;gap:7px;margin-top:9px}
.chestBtn{flex:1;padding:7px 2px;border-radius:9px;border:1.5px solid #57468a;background:#241a45;color:#d9d2f2;font-size:11.5px;font-weight:800;cursor:pointer;text-align:center;font-family:inherit}
.chestBtn.ready{border-color:#ffd100;background:linear-gradient(180deg,#8a6a10,#5e4a08);color:#ffe9a8;animation:glowPulse 1.2s infinite}
.chestBtn.got{opacity:.45;cursor:default;animation:none}

  ctx.fillStyle=shade(hero.skin,-24);ctx.beginPath();ctx.ellipse(50,47,8.5,5.5,0,0,7);ctx.fill();
  ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.arc(46.5,46,1.5,0,7);ctx.arc(53.5,46,1.5,0,7);ctx.fill();}
 if(hero.race==='elf'){ctx.fillStyle=hero.skin;ctx.beginPath();ctx.ellipse(27,38,4.5,10,-0.5,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(73,38,4.5,10,0.5,0,7);ctx.fill();}
 if(hero.race==='undead'){ctx.fillStyle='rgba(70,90,70,.5)';ctx.beginPath();ctx.arc(42,38,4,0,7);ctx.arc(58,38,4,0,7);ctx.fill();}
 /* 头发 */
 const hairCols=['#2a2a32','#6e4f2a','#d8b25e','#e8e8f2','#3a2a1a','#8e2f23','#f2e6c8','#2e5e2e','#c44a7a','#7ad8ff','#4a3a6e','#5e8c3a','#d8702a','#8a6d2f'];

 if(hero.hair===0){/* 光头 */}
 else if(hero.hair===3){rr(ctx,30,8,40,16,7);ctx.fill();ctx.fillStyle='#e8e8f2';rr(ctx,34,20,6,22,3);ctx.fill();rr(ctx,60,20,6,22,3);ctx.fill();}
 else if(hero.hair===8){ctx.beginPath();ctx.moveTo(32,26);ctx.lineTo(40,8);ctx.lineTo(46,24);ctx.lineTo(52,6);ctx.lineTo(58,24);ctx.lineTo(64,9);ctx.lineTo(68,27);ctx.closePath();ctx.fill();}
 else{ctx.beginPath();ctx.arc(50,33,21.5,Math.PI*1.02,Math.PI*1.98);ctx.quadraticCurveTo(50,16,28.5,33);ctx.fill();
  if(hero.hair===2||hero.hair===6){rr(ctx,27,26,6,26,3);ctx.fill();rr(ctx,67,26,6,26,3);ctx.fill();}}
 /* 眼睛嘴巴 */
 ctx.fillStyle='#241d18';ctx.beginPath();ctx.arc(42.5,42,2.3,0,7);ctx.arc(57.5,42,2.3,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(43.2,41.2,0.8,0,7);ctx.arc(58.2,41.2,0.8,0,7);ctx.fill();
 ctx.strokeStyle='#7a4a32';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(50,48,4.6,0.25,Math.PI-0.25);ctx.stroke();
 ctx.fillStyle='rgba(255,120,120,.35)';ctx.beginPath();ctx.arc(35,47,3.4,0,7);ctx.arc(65,47,3.4,0,7);ctx.fill();
 /* 武器 */
 ctx.save();ctx.translate(84,66);
 const wp=hero.weapon;
 if(wp==='sword'){ctx.rotate(0.5);ctx.fillStyle='#d8dde6';rr(ctx,-1.8,-20,3.6,24,1.5);ctx.fill();ctx.fillStyle='#ffd100';rr(ctx,-5,3,10,3,1.5);ctx.fill();}
 else if(wp==='axe'){ctx.rotate(0.4);ctx.fillStyle='#6e4f2a';rr(ctx,-1.5,-16,3,26,1.5);ctx.fill();ctx.fillStyle='#b9c0cc';ctx.beginPath();ctx.moveTo(0,-18);ctx.quadraticCurveTo(13,-14,11,-2);ctx.quadraticCurveTo(5,-6,0,-5);ctx.fill();}
 else if(wp==='staff'||wp==='wand'||wp==='totem'){ctx.rotate(0.25);ctx.fillStyle='#6e4f2a';rr(ctx,-1.4,-22,2.8,32,1.4);ctx.fill();ctx.fillStyle=wp==='totem'?'#7ddb4a':'#7ad8ff';ctx.beginPath();ctx.arc(0,-24,4.6,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(-1.4,-25.4,1.6,0,7);ctx.fill();}

 else if(wp==='dagger'){ctx.rotate(0.6);ctx.fillStyle='#cfd6e2';ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(3,2);ctx.lineTo(-3,2);ctx.fill();ctx.fillStyle='#3a3f4d';rr(ctx,-1.4,2,2.8,7,1.2);ctx.fill();}

 else if(wp==='orb'){ctx.fillStyle='#c07dff';ctx.beginPath();ctx.arc(0,-6,6.4,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.arc(-2,-8,2.2,0,7);ctx.fill();}
 else if(wp==='claw'){ctx.strokeStyle='#e8e8f2';ctx.lineWidth=2;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*4,-10);ctx.quadraticCurveTo(i*5,-2,i*4,4);ctx.stroke();}}
 ctx.restore();ctx.restore();
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}

 if(h.star>=3&&H.passive.key==='healup')st.atk=Math.round(st.atk*1.0);
 st.power=Math.round(st.hp*0.32+st.atk*7.5+st.def*5.5);
 return st;
}

}

function grantStageRewards(c,s,elite,stars){

 const gold=st.rew.gold+(elite?Math.round(st.rew.gold*0.6):0);
 S.gold+=gold;gainAccXp(st.rew.xp);
 const heroXp=Math.round(st.rew.xp*1.5);const heroReport=[];
 S.team.forEach(id=>{if(!id)return;const h=S.heroes[id];const before={lvl:h.lvl,st:heroStats(id)};

  heroReport.push({id,lvlUp:h.lvl>before.lvl,lvl:h.lvl,xpGain:heroXp,prog:Math.floor(h.xp)+'/'+heroXpNeed(h.lvl),
   dHp:after.hp-before.st.hp,dAtk:after.atk-before.st.atk,dDef:after.def-before.st.def});});
 const drops=[];
 if(Math.random()<0.55){const p=Math.random()<0.7?'s':'m';S.potions[p]++;drops.push(p==='s'?'经验药水（小）':'经验药水（大）');}

 if(first&&st.rew.gem){S.gems+=st.rew.gem;drops.push('首通 💎 '+st.rew.gem);}
 return {gold,xp:st.rew.xp,drops,heroReport};
}

function rollRarity(gem){
 if(gem){const r=Math.random();return r<0.03?4:r<0.25?3:2;}
 const r=Math.random();return r<0.02?3:r<0.40?2:0;
}
function doSummon(type,n){
 const gem=type==='gem';const cost=gem?(n===10?2520:280):(n===10?90000:10000);
 if(gem&&S.gems<cost){toast('钻石不足');SFX.err();return;}
 if(!gem&&S.gold<cost){toast('金币不足');SFX.err();return;}
 if(gem)S.gems-=cost;else S.gold-=cost;
 const results=[];let gotPurplePlus=false;
 for(let i=0;i<n;i++){
  S.summon.total++;if(gem)S.summon.pity++;else S.summon.goldTotal++;
  let rar=rollRarity(gem);
  if(gem&&S.summon.pity>=10&&rar<3)rar=3;
  if(gem&&rar>=3){S.summon.pity=0;gotPurplePlus=true;}
  if(rar===0){const h=pick(HEROES);addShards(h.id,5);results.push({junk:'shard',hero:h.id,rar:2});continue;}
  const pool=HEROES.filter(h=>h.rarity===rar);const H=pick(pool);
  if(S.heroes[H.id]){const sh=rar===2?10:rar===3?30:80;S.heroes[H.id].shards+=sh;results.push({hero:H.id,rar,dup:sh});}
  else{S.heroes[H.id]={lvl:1,xp:0,star:1,shards:0,eq:{}};results.push({hero:H.id,rar,isNew:true});}
 }
 if(gem&&n===10&&!gotPurplePlus){/* 十连保底：把最后一张蓝卡升级为紫卡 */
  const idx=results.map((r,i)=>r.rar===2?i:-1).filter(i=>i>=0).pop();
  if(idx!=null){const H=pick(HEROES.filter(h=>h.rarity===3));results[idx]={hero:H.id,rar:3,isNew:!S.heroes[H.id]};if(!S.heroes[H.id])S.heroes[H.id]={lvl:1,xp:0,star:1,shards:0,eq:{}};}}
 dailyProg('summon');SFX.summon();saveGame();renderTop();updateBadges();
 /* 演出 */
 const fx=$('summonFx');fx.style.display='flex';
 const maxRar=Math.max(...results.map(r=>r.rar));
 $('summonBeam').style.background='radial-gradient(circle,'+(maxRar===4?'#ff9d45':maxRar===3?'#c07dff':'#4ab8ff')+' 0%,transparent 70%)';
 $('summonBeam').style.boxShadow='0 0 60px 20px '+(maxRar===4?'rgba(255,157,69,.6)':maxRar===3?'rgba(192,125,255,.6)':'rgba(74,184,255,.5)');
 $('summonTitle').textContent=maxRar===4?'✦ 传说降临！✦':maxRar===3?'史诗英雄！':'召唤结果';
 const box=$('summonResults');box.innerHTML='';
 results.forEach((r,i)=>{setTimeout(()=>{
  if(r.junk==='shard'){box.innerHTML+='<div class="hcard r2"><div style="font-size:34px;padding:16px 0 6px">🧩</div><div class="nm">'+HERO_MAP[r.hero].name.split('·')[0]+' 碎片</div><div class="meta"><span>碎片 +5</span></div></div>';}
  else{const H=HERO_MAP[r.hero];const d=document.createElement('div');d.className='hcard r'+r.rar+(r.isNew?' newTag':'');
   d.innerHTML='<canvas width="140" height="140"></canvas><div class="nm">'+H.name+'</div><div class="meta"><span>'+H.cls+'</span><span>'+(r.isNew?'<span class="grn">新英雄！</span>':'碎片 +'+r.dup)+'</span></div>';
   box.appendChild(d);drawChibi(d.querySelector('canvas'),H);}
  if(i===results.length-1)$('summonClose').style.display='block';
 },180*(i+1));});
 $('summonClose').onclick=()=>{fx.style.display='none';$('summonClose').style.display='none';renderSummon();};
}

 +'<p style="font-size:13.5px;line-height:1.85">生命：<b>'+Math.max(0,Math.round(u.hp))+' / '+u.maxhp+'</b><br>攻击：'+u.atk+' · 防御：'+u.defense+'<br>定位：'+(u.isHero?D.cls:(D.role==='boss'?'首领':D.role==='tank'?'坦克':D.role==='heal'?'治疗':'输出'))+(D.ult?'<br>大招【'+D.ult.name+'】'+(D.ult.desc||''):'')+(u.stun>0?'<br><span class="gold">当前被眩晕</span>':'')+(u.shield>0?'<br>护盾：'+Math.round(u.shield):'')+'</p><div class="kvBtns"><button class="btn" onclick="closeModal()">知道了</button></div>');
}
function refreshUnit(u){
 if(!u.el)return;const hpI=u.el.querySelector('.hpbar i'),enI=u.el.querySelector('.enbar i');
 hpI.style.width=clamp(u.hp/u.maxhp*100,0,100)+'%';enI.style.width=clamp(u.energy,0,100)+'%';
 u.el.querySelector('.hpbar').classList.toggle('low',u.alive&&u.hp/u.maxhp<0.3);
 u.el.classList.toggle('dead',!u.alive);

function btLogFn(msg){const l=$('btLog');const d=document.createElement('div');d.textContent=msg;l.appendChild(d);while(l.children.length>4)l.removeChild(l.firstChild);}
function stagePos(u){if(G3&&u.g3)return bt3dProject(u);const st=$('btStage');return {x:(u.px+6.4)/12.8*(st.clientWidth||360),y:(u.pz+5.2)/10.4*(st.clientHeight||480)+14};}
function syncUnitPos(u){if(!G3&&u.el){u.el.style.left=((u.px+6.4)/12.8*100)+'%';u.el.style.top=((u.pz+5.2)/10.4*100)+'%';}}
function dist2d(a,b){const dx=a.px-b.px,dz=a.pz-b.pz;return Math.sqrt(dx*dx+dz*dz);}
function moveToward(u,tx,tz,maxStep){const dx=tx-u.px,dz=tz-u.pz;const d=Math.sqrt(dx*dx+dz*dz);if(d<0.01)return;const s=Math.min(d,maxStep);u.px+=dx/d*s;u.pz+=dz/d*s;u.faceA=Math.atan2(dx,dz);}
function floatDmg(u,txt,cls){if(B.fast)return;const stg=$('btStage');if(stg.querySelectorAll('.dmgFloat').length>22&&cls!=='crit')return;const p=stagePos(u);const d=document.createElement('div');d.className='dmgFloat '+(cls||'');d.textContent=txt;
 d.style.left=p.x+'px';d.style.top=p.y+'px';$('btStage').appendChild(d);setTimeout(()=>d.remove(),880);}
function fxSlash(u){if(B.fast||G3)return;const p=stagePos(u);const d=document.createElement('div');d.className='slashFx';d.style.left=(p.x-26)+'px';d.style.top=(p.y-20)+'px';$('btStage').appendChild(d);setTimeout(()=>d.remove(),240);}
function fxProj(from,to,color){if(B.fast)return;if(G3){bt3dProjectile(from,to,color);return;}const a=stagePos(from),b=stagePos(to);const d=document.createElement('div');d.className='proj';
 d.style.background=color;d.style.color=color;d.style.left=a.x+'px';d.style.top=a.y+'px';d.style.transition='all .17s linear';
 $('btStage').appendChild(d);requestAnimationFrame(()=>{d.style.left=b.x+'px';d.style.top=b.y+'px';});setTimeout(()=>d.remove(),190);}
function lunge(u){if(B.fast||!u.el)return;if(G3){bt3dLunge(u);return;}const dir=u.side==='ally'?1:-1;u.el.style.transform='translateX('+(dir*17)+'px)';setTimeout(()=>{if(u.el)u.el.style.transform='';},140);}
function foesOf(u){return B.units.filter(x=>x.alive&&x.side!==u.side);}
function alliesOf(u){return B.units.filter(x=>x.alive&&x.side===u.side);}
function pickTarget(u,mode){
 const foes=foesOf(u);if(!foes.length)return null;
 if(u.side==='foe'){const taunter=alliesOf(u).find(a=>a.tauntT>0);if(taunter)return taunter;}
 if(mode==='back'){const b=foes.filter(f=>f.row==='back');return pick(b.length?b:foes);}
 if(mode==='lowhp'){return foes.reduce((a,b)=>a.hp/a.maxhp<=b.hp/b.maxhp?a:b);}
 const f=foes.filter(x=>x.row==='front');return pick(f.length?f:foes);
}
function pickHealTarget(u){const al=alliesOf(u);return al.reduce((a,b)=>a.hp/a.maxhp<=b.hp/b.maxhp?a:b);}
function dealDmg(src,tgt,mult,opt){
 opt=opt||{};if(!tgt||!tgt.alive||(!src.alive&&!opt.ultLand))return 0;
 if(!opt.dot&&Math.random()<(tgt.dodge||0)){floatDmg(tgt,'闪避','miss');return 0;}
 let crit=opt.forceCrit||Math.random()*100<(src.crit-(tgt.isHero&&tgt.star>=3&&tgt.def.passive&&tgt.def.passive.key==='anticrit'?src.crit*0.5:0));
 let raw=src.atk*(1+src.buffAtkPct)*mult*rnd(0.92,1.08);
 if(B&&B.time>150)raw*=1+(B.time-150)*0.03;/* 狂暴：久战增伤防僵局 */
 let dmg=raw*100/(100+tgt.defense);
 if(tgt.isHero&&tgt.star>=3&&tgt.def.passive&&tgt.def.passive.key==='tanklow'&&tgt.hp/tgt.maxhp<0.3)dmg*=0.65;
 if(crit)dmg*=(src.isHero&&src.star>=3&&src.def.passive&&src.def.passive.key==='critdmg')?2:1.6;
 dmg=Math.max(1,Math.round(dmg));
 let absorbed=0;
 if(tgt.shield>0){absorbed=Math.min(tgt.shield,dmg);tgt.shield-=absorbed;dmg-=absorbed;}
 tgt.hp-=dmg;
 if(dmg>0){tgt.energy=clamp(tgt.energy+11,0,100);floatDmg(tgt,(crit?'暴击 ':'')+'-'+dmg,crit?'crit':'hurt');}
 else floatDmg(tgt,'护盾吸收','miss');
 fxSlash(tgt);
 if(!B.fast&&tgt.el){if(G3)bt3dFlash(tgt);else{tgt.el.classList.add('hitFx');setTimeout(()=>{if(tgt.el)tgt.el.classList.remove('hitFx');},110);}}
 if(src.isHero&&src.star>=3&&src.def.passive){
  if(src.def.passive.key==='lifesteal'&&dmg>0)doHeal(src,src,Math.round(dmg*0.12),true);
  if(src.def.passive.key==='poison'&&!opt.dot)tgt.dots.push({t:3,tick:0,amt:Math.round(src.atk*0.25),src});
  if(src.def.passive.key==='freeze'&&Math.random()<0.2)tgt.stun=Math.max(tgt.stun,0.8);
 }
 if(tgt.hp<=0)killUnit(src,tgt);
 refreshUnit(tgt);refreshUnit(src);
 return dmg;
}
function doHeal(src,tgt,amt,silent){
 if(!tgt||!tgt.alive)return;let a=amt;
 if(src.isHero&&src.star>=3&&src.def.passive&&src.def.passive.key==='healup')a=Math.round(a*1.2);
 tgt.hp=Math.min(tgt.maxhp,tgt.hp+a);if(!silent)floatDmg(tgt,'+'+a,'heal');refreshUnit(tgt);
}
function killUnit(src,tgt){
 tgt.alive=false;tgt.hp=0;tgt.energy=0;tgt.windup=0;tgt.pendingAtk=null;tgt.ultWindup=0;
 if(tgt.el)tgt.el.classList.remove('windup','charging');
 if(G3)bt3dDie(tgt);
 if(tgt.side==='ally')B.allyDeaths++;
 btLogFn('💀 '+tgt.name+' 阵亡'+(src?'（'+src.name+'）':''));
 refreshUnit(tgt);checkBattleEnd();
}



function battleTick(){
 if(!B||B.over||B.paused)return;const dt=0.1*B.speed;B.time=(B.time||0)+dt;
 const tt=Math.floor(B.time);if(B._tt!==tt){B._tt=tt;$('btTimer').textContent=String(Math.floor(tt/60)).padStart(2,'0')+':'+String(tt%60).padStart(2,'0');$('btTimer').classList.toggle('hot',B.time>150);}
 updateBtCards();
 for(const u of B.units){
  if(!u.alive)continue;
  if(u.slowT>0)u.slowT-=dt;if(u.tauntT>0)u.tauntT-=dt;
  for(let i=u.dots.length-1;i>=0;i--){const d=u.dots[i];d.t-=dt;d.tick-=dt;
   if(d.tick<=0){d.tick=1;const dmg=Math.max(1,Math.round(d.amt*100/(100+u.defense)));u.hp-=dmg;floatDmg(u,'毒 -'+dmg,'hurt');if(u.hp<=0){killUnit(d.src,u);} }
   if(d.t<=0||!u.alive)u.dots.splice(i,1);}
  if(!u.alive)continue;
  for(let i=u.hots.length-1;i>=0;i--){const h=u.hots[i];h.t-=dt;h.tick-=dt;
   if(h.tick<=0){h.tick=1;doHeal(h.src,u,h.amt,true);floatDmg(u,'+'+h.amt,'heal');}
   if(h.t<=0)u.hots.splice(i,1);}
  const spdF=u.spd*(u.slowT>0?1-u.slowAmt:1);
  u.atkCd-=dt*spdF;
  if(B.time<0.9){syncUnitPos(u);refreshUnit(u);continue;}
  if(u.stun>0){u.stun-=dt;syncUnitPos(u);refreshUnit(u);continue;}
  if(u.ultWindup>0){u.ultWindup-=dt;
   if(u.ultWindup<=0){if(u.el)u.el.classList.remove('charging');if(G3)bt3dChargeEnd(u);castUlt(u);if(B.over)return;}
   syncUnitPos(u);refreshUnit(u);continue;}
  if(u.windup>0){u.windup-=dt;
   if(u.windup<=0&&u.pendingAtk){const f=u.pendingAtk;u.pendingAtk=null;if(u.el)u.el.classList.remove('windup');f();if(B.over)return;}
   syncUnitPos(u);refreshUnit(u);continue;}
  const basic=u.def.basic||{type:'dmg',target:'front',mult:1};
  if(basic.type==='heal'){
   if(u.atkCd<=0){const t=pickHealTarget(u);
    if(t&&t.hp<t.maxhp){u.atkCd+=2.6;startWindup(u,()=>executeHeal(u));}
    else if(Math.random()<0.6){const f=pickTarget(u,'front');if(f){u.atkCd+=2.6;u.curTgt=f;startWindup(u,()=>executeBasic(u,f));}}}
  }else{
   if(u.side==='foe'){const tn=alliesOf(u).find(a=>a.tauntT>0);if(tn&&u.curTgt!==tn)u.curTgt=tn;}
   if(!u.curTgt||!u.curTgt.alive)u.curTgt=pickTarget(u,basic.target);
   const t=u.curTgt;
   if(t){
    if(dist2d(u,t)>u.range){
     const ang=Math.atan2(u.pz-t.pz,u.px-t.px)+(u.slot-2)*0.6;
     moveToward(u,t.px+Math.cos(ang)*u.range*0.92,t.pz+Math.sin(ang)*u.range*0.92,3.1*dt*(u.slowT>0?1-u.slowAmt:1));
    }else{
     u.faceA=Math.atan2(t.px-u.px,t.pz-u.pz);
     if(u.atkCd<=0){u.atkCd+=2.6;startWindup(u,()=>executeBasic(u,t));}
    }
   }else if(dist2d(u,{px:u.homeX,pz:u.homeZ})>0.25)moveToward(u,u.homeX,u.homeZ,1.6*dt);
  }
  if(u.energy>=100&&u.def.ult&&u.windup<=0&&u.ultWindup<=0&&(B.autoUlt||u.side==='foe')){u.ultWindup=0.5;if(G3)bt3dCharge(u);if(u.el)u.el.classList.add('charging');}
  syncUnitPos(u);refreshUnit(u);
 }
 for(let i=0;i<B.units.length;i++){const a=B.units[i];if(!a.alive)continue;
  for(let j=i+1;j<B.units.length;j++){const b=B.units[j];if(!b.alive)continue;
   const dx=b.px-a.px,dz=b.pz-a.pz;const d2=dx*dx+dz*dz;
   if(d2>0.0001&&d2<1.0){const d=Math.sqrt(d2),push=(1.0-d)*0.5/d;a.px-=dx*push;a.pz-=dz*push;b.px+=dx*push;b.pz+=dz*push;}}}
}
function startWindup(u,fn){u.windup=u.melee?0.3:0.38;u.pendingAtk=fn;if(G3)bt3dWindup(u);if(u.el)u.el.classList.add('windup');}
function executeBasic(u,t){
 if(!u.alive)return;const basic=u.def.basic||{type:'dmg',target:'front',mult:1};
 if(!t||!t.alive)t=pickTarget(u,basic.target);if(!t)return;
 u.faceA=Math.atan2(t.px-u.px,t.pz-u.pz);
 rangedOrMelee(u,t,()=>{
  dealDmg(u,t,basic.mult);
  if(u.isHero&&u.star>=3&&u.def.passive&&u.def.passive.key==='extraShot'&&t.alive&&Math.random()<0.25)setTimeout(()=>{if(t.alive&&u.alive)dealDmg(u,t,0.6);},160);
  if(u.isHero&&u.star>=3&&u.def.passive&&u.def.passive.key==='stackAtk')u.buffAtkPct=Math.min(0.2,u.buffAtkPct+0.04);
 });
 u.energy=clamp(u.energy+30,0,100);
}
function executeHeal(u){
 if(!u.alive)return;const basic=u.def.basic;const t=pickHealTarget(u);if(!t)return;
 if(B.fast){doHeal(u,t,Math.round(u.atk*basic.mult));u.energy=clamp(u.energy+30,0,100);return;}
 fxProj(u,t,'#7ddb4a');setTimeout(()=>{if(u.alive&&t.alive)doHeal(u,t,Math.round(u.atk*basic.mult));},170);
 u.energy=clamp(u.energy+30,0,100);
}
function rangedOrMelee(u,t,hitFn){
 if(B&&B.fast){hitFn();return;}
 const ranged=!u.melee;
 if(ranged){fxProj(u,t,u.side==='ally'?'#ffd76a':'#ff8a7a');setTimeout(()=>{if(u.alive)hitFn();},B.fast?0:170);}
 else{lunge(u);setTimeout(()=>{if(u.alive)hitFn();},B.fast?0:110);}
}
let ULT_DOPT=null;
const TELE_ULT={aoe:{c:'#ff9d45',r:2.9},aoeStun:{c:'#ffe14d',r:2.9},aoeSlow:{c:'#7ad8ff',r:2.9},frontAoe:{c:'#ff7a2a',r:2.2},dotAll:{c:'#b07dff',r:2.9}};
function castUlt(u){
 if(!u.alive||u.energy<100)return;const ult=u.def.ult;if(!ult)return;
 u.energy=0;u.ultWindup=0;if(u.el)u.el.classList.remove('charging');if(G3)bt3dChargeEnd(u);refreshUnit(u);SFX.ult();
 if(!B.fast){const bn=$('ultBanner');$('ultSkill').textContent=ult.name;$('ultWho').textContent=u.name+' 释放大招';
  const ucol=({aoe:'#ff9d45',aoeStun:'#ffe14d',aoeSlow:'#7ad8ff',frontAoe:'#ff7a2a',dotAll:'#b07dff'})[ult.type]||'#ffd100';const skEl=$('ultSkill');skEl.style.color=ucol;skEl.style.textShadow='0 0 18px '+ucol+',0 3px 0 #5a3800';
  const stgEl=$('btStage');stgEl.classList.remove('shake');void stgEl.offsetWidth;stgEl.classList.add('shake');
  if(G3)bt3dUltFx(u);
  const fl=$('ultFlash');if(fl){fl.style.animation='none';void fl.offsetWidth;fl.style.animation='ultFlashA .45s ease-out';}
  const cv=$('ultCv');if(u.isHero)drawChibi(cv,u.def);else drawMonster(cv,u.def.art);
  bn.style.display='flex';setTimeout(()=>bn.style.display='none',820/B.speed);}
 btLogFn('✦ '+u.name+' 释放【'+ult.name+'】');
 const runUltDamage=()=>{const A=u.atk;
 switch(ult.type){
  case 'aoe':foesOf(u).forEach(f=>dealDmg(u,f,ult.mult,ULT_DOPT));break;
  case 'aoeStun':foesOf(u).forEach(f=>{dealDmg(u,f,ult.mult,ULT_DOPT);if(f.alive)f.stun=Math.max(f.stun,ult.stun);});break;
  case 'aoeSlow':foesOf(u).forEach(f=>{dealDmg(u,f,ult.mult,ULT_DOPT);f.slowT=3;f.slowAmt=ult.slow;});break;
  case 'frontAoe':{const fs=foesOf(u).filter(f=>f.row==='front');(fs.length?fs:foesOf(u)).forEach(f=>dealDmg(u,f,ult.mult,ULT_DOPT));break;}
  case 'snipe':{const t=pickTarget(u,'lowhp');if(t)dealDmg(u,t,ult.mult);break;}
  case 'backstab':{const t=pickTarget(u,'back');if(t)dealDmg(u,t,ult.mult,{forceCrit:true});break;}
  case 'multiShot':{const fs=[...foesOf(u)].sort(()=>Math.random()-0.5).slice(0,ult.count||3);fs.forEach(f=>dealDmg(u,f,ult.mult));break;}
  case 'flurry':{for(let i=0;i<(ult.hits||4);i++){const t=pickTarget(u,'front');if(t)setTimeout(((tt,ii)=>()=>{if(u.alive&&tt.alive)dealDmg(u,tt,ult.mult);})(t,i),i*120);}break;}
  case 'dotAll':foesOf(u).forEach(f=>{dealDmg(u,f,ult.mult,ULT_DOPT);f.dots.push({t:ult.dotTicks,tick:0,amt:Math.round(A*ult.dotMult),src:u});});break;
  case 'healAll':alliesOf(u).forEach(a=>doHeal(u,a,Math.round(A*ult.mult)));SFX.heal();break;
  case 'hotAll':alliesOf(u).forEach(a=>a.hots.push({t:ult.hotTicks,tick:0,amt:Math.round(A*ult.mult),src:u}));SFX.heal();break;
  case 'shieldHeal':alliesOf(u).forEach(a=>{a.shield+=Math.round(A*ult.shield);doHeal(u,a,Math.round(A*ult.heal));refreshUnit(a);});break;
  case 'tauntShield':u.tauntT=3;u.shield+=Math.round(A*ult.shield);refreshUnit(u);break;
  case 'revive':{const dead=B.units.filter(x=>x.side===u.side&&!x.alive);
   if(dead.length){const t=dead[0];t.alive=true;t.hp=Math.round(t.maxhp*0.5);t.energy=30;if(G3)bt3dRevive(t);btLogFn('✨ '+t.name+' 被复活了！');refreshUnit(t);}
   else alliesOf(u).forEach(a=>doHeal(u,a,Math.round(A*ult.mult)));SFX.heal();break;}
 }
 };
 const tele=TELE_ULT[ult.type];
 if(tele&&G3&&!B.fast){const tgts=ult.type==='frontAoe'?(()=>{const fs=foesOf(u).filter(f=>f.row==='front');return fs.length?fs:foesOf(u);})():foesOf(u);
  if(tgts.length){const cx=tgts.reduce((s,x)=>s+x.px,0)/tgts.length,cz=tgts.reduce((s,x)=>s+x.pz,0)/tgts.length;
   bt3dTelegraph(cx,cz,tele.r,tele.c);bt3dSkillRain(ult.type,cx,cz,tele.r);
   setTimeout(()=>{if(B&&!B.over){ULT_DOPT={ultLand:true};runUltDamage();ULT_DOPT=null;bt3dRing(cx,cz,tele.c,0.4,tele.r);bt3dBurst(cx,cz,tele.c,8);}},750);
  }else runUltDamage();
 }else runUltDamage();
 if(G3&&!B.fast&&!tele)bt3dUltEffect(u,ult);
 B.units.forEach(refreshUnit);
}

function checkBattleEnd(){
 if(!B||B.over)return;
 const alliesAlive=B.units.some(u=>u.side==='ally'&&u.alive);
 const foesAlive=B.units.some(u=>u.side==='foe'&&u.alive);
 if(!foesAlive){
  if(B.wave<B.waves.length-1){B.wave++;spawnWave();return;}
  endBattle(true);
 }else if(!alliesAlive)endBattle(false);
}
function spawnWave(){
 const wv=B.waves[B.wave];
 if(G3)B.units.filter(u=>u.side==='foe').forEach(u=>bt3dRemoveUnit(u));
 B.units=B.units.filter(u=>u.side==='ally');
 document.querySelectorAll('#btStage .unit.foe').forEach(e=>e.remove());
 const foes=wv.map((w,i)=>B.mkFoe(w,i));
 foes.forEach(u=>{u.el=unitEl(u);B.units.push(u);refreshUnit(u);});
 const tag=$('waveTag');tag.textContent=B.waves.length>1?'第 '+ (B.wave+1) +' 波':'';tag.style.display=B.waves.length>1?'block':'none';
 setTimeout(()=>tag.style.display='none',900);
 $('btWave').textContent=B.waves.length>1?('波次 '+(B.wave+1)+'/'+B.waves.length):'';
 btLogFn('⚔️ 敌人出现了！');
}
function startBattle(cfg){
 /* cfg: {title, bg, waves, mkFoe(w,i), onEnd(win), fleeLabel} */

 $('btLog').innerHTML='';
 B={units:[],waves:cfg.waves,wave:0,speed:1,autoUlt:true,over:false,fast:false,paused:false,allyDeaths:0,mkFoe:cfg.mkFoe,onEnd:cfg.onEnd,title:cfg.title};
 if(USE3D())bt3dInit(cfg.bg);
 S.team.forEach((id,i)=>{if(id){const u=heroUnit(id,i);B.units.push(u);}});
 applyAuras(B.units);
 B.units.forEach(u=>{u.el=unitEl(u);refreshUnit(u);});
 $('btTitle').textContent=cfg.title;
 $('btStage').className=cfg.bg||'';
 $('battleScr').classList.add('on');
 if(G3)G3.onResize();
 $('btDone').style.display='none';$('btAgain').style.display='none';$('btFlee').style.display='block';
 $('btAuto').classList.add('on');$('btSpd').textContent='×1';$('btPause').textContent='⏸';$('btTimer').textContent='00:00';$('btTimer').classList.remove('hot');$('btMeLv').textContent=S.accLvl||1;
 spawnWave();buildBtCards();
 clearInterval(btTimer);btTimer=setInterval(battleTick,100);
}
function endBattle(win){

 if(win)SFX.win();else SFX.lose();

}

function genArenaOpps(){
 arenaOpps=[];const myTeam=S.team.filter(Boolean);const myLvl=Math.max(1,Math.round(myTeam.reduce((s,id)=>s+S.heroes[id].lvl,0)/Math.max(1,myTeam.length)));
 const myPower=teamPower();
 for(let i=0;i<4;i++){
  const size=clamp(myTeam.length+irnd(-1,1),3,5);
  const sorted=[...HEROES].sort((a,b)=>(a.role==='tank'?0:1)-(b.role==='tank'?0:1));
  const tanks=sorted.filter(h=>h.role==='tank').sort(()=>Math.random()-0.5);
  const rest=sorted.filter(h=>h.role!=='tank').sort(()=>Math.random()-0.5);

  const lvl=clamp(myLvl+irnd(-2,2),1,30);const star=clamp(1+Math.floor(lvl/9)+irnd(0,1),1,4);
  const rawPower=pool.reduce((s,H)=>{const grow=1+(lvl-1)*0.115,sm=STAR_MULT[star];return s+Math.round(H.base.hp*grow*sm*0.32+H.base.atk*grow*sm*7.5+H.base.def*grow*sm*5.5);},0);

 }
 arenaOpps.sort((a,b)=>a.power-b.power);
}

 const pos={x:u.px,z:u.pz};const baseY=(model.userData.fly||0)*1.35;
 grp.position.set(pos.x,baseY-1.5,pos.z);grp.rotation.y=u.faceA;
 G3.scene.add(grp);
 const mats=[];model.traverse(m=>{if(m.isMesh){m.castShadow=true;if(!mats.includes(m.material))mats.push(m.material);}});
 u.g3={grp,spin,bob,mats,phase:Math.random()*6.28,bx:pos.x,bz:pos.z,baseY,head:(model.userData.head||1.4)*1.35,fly:(model.userData.fly||0)*1.35,dead:false};
 bt3dTween(0.45,k=>{grp.position.y=baseY-1.5+1.5*(1-Math.pow(1-k,2));});
}
function bt3dRemoveUnit(u){if(G3&&u.g3){G3.scene.remove(u.g3.grp);u.g3=null;}}
function bt3dProject(u){
 const st=$('btStage');const v=new THREE.Vector3(u.g3.grp.position.x,u.g3.grp.position.y+u.g3.head+0.25,u.g3.grp.position.z);
 v.project(G3.camera);
 return {x:(v.x*0.5+0.5)*(st.clientWidth||360),y:(-v.y*0.5+0.5)*(st.clientHeight||480)-((u.slot||0)%2)*16};
}
function bt3dLunge(u){if(!u.g3)return;u.g3.lungeZ=0.4;u.g3.hopY=0.14;}
function bt3dWindup(u){if(u.g3)u.g3.leanT=0.35;}
function bt3dCharge(u){if(!u.g3||u.g3.swirl)return;const grp=new THREE.Group();const col=u.side==='ally'?0xffd76a:0xc07dff;
 for(let i=0;i<6;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.075,6,5),new THREE.MeshBasicMaterial({color:col,transparent:true}));grp.add(m);}
 u.g3.grp.add(grp);u.g3.swirl=grp;
 bt3dTween(0.5,k=>{for(let i=0;i<6;i++){const a=k*5+i/6*Math.PI*2;const mm=grp.children[i];if(mm){mm.position.set(Math.cos(a)*0.62,0.25+k*0.9,Math.sin(a)*0.62);mm.material.opacity=1-k*0.4;}}},()=>{if(u.g3&&u.g3.swirl===grp){u.g3.grp.remove(grp);u.g3.swirl=null;}});}
function bt3dChargeEnd(u){if(u.g3){if(u.g3.swirl){u.g3.grp.remove(u.g3.swirl);u.g3.swirl=null;}u.g3.mats.forEach(m=>m.emissive.setHex(m.userData.e0||0));}}
function bt3dRing(cx,cz,color,dur,maxR){const m=new THREE.Mesh(new THREE.RingGeometry(0.42,0.55,36),new THREE.MeshBasicMaterial({color:new THREE.Color(color),transparent:true,opacity:0.85,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.set(cx,0.06,cz);G3.scene.add(m);bt3dTween(dur||0.45,k=>{const s=0.6+(maxR||2.1)*k;m.scale.set(s,s,s);m.material.opacity=0.85*(1-k);},()=>{G3.scene.remove(m);});}
function bt3dBurst(cx,cz,color,n){for(let i=0;i<(n||7);i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,6),new THREE.MeshBasicMaterial({color:new THREE.Color(color),transparent:true}));const a=Math.random()*6.28,r=0.25+Math.random()*0.5;m.position.set(cx+Math.cos(a)*r,0.5,cz+Math.sin(a)*r);G3.scene.add(m);const vy=1+Math.random()*1.2;bt3dTween(0.55,k=>{m.position.y=0.5+vy*k;m.material.opacity=1-k;},()=>{G3.scene.remove(m);});}}
function bt3dTelegraph(cx,cz,r,colorHex){
 const disc=new THREE.Mesh(new THREE.CircleGeometry(r,36),new THREE.MeshBasicMaterial({color:new THREE.Color(colorHex),transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
 disc.rotation.x=-Math.PI/2;disc.position.set(cx,0.05,cz);G3.scene.add(disc);
 const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.16,r,44),new THREE.MeshBasicMaterial({color:new THREE.Color(colorHex),transparent:true,opacity:0.95,side:THREE.DoubleSide,depthWrite:false}));
 ring.rotation.x=-Math.PI/2;ring.position.set(cx,0.06,cz);G3.scene.add(ring);
 const inner=new THREE.Mesh(new THREE.RingGeometry(r*0.55-0.05,r*0.55,36),new THREE.MeshBasicMaterial({color:new THREE.Color(colorHex),transparent:true,opacity:0.75,side:THREE.DoubleSide,depthWrite:false}));
 inner.rotation.x=-Math.PI/2;inner.position.set(cx,0.06,cz);G3.scene.add(inner);
 const runes=new THREE.Group();const rm=new THREE.MeshBasicMaterial({color:new THREE.Color(colorHex),transparent:true,opacity:0.9,depthWrite:false});
 for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const rb=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.03,0.3),rm);rb.position.set(Math.cos(a)*r*0.78,0,Math.sin(a)*r*0.78);rb.rotation.y=-a;runes.add(rb);}
 runes.position.set(cx,0.06,cz);G3.scene.add(runes);
 bt3dTween(0.75,k=>{disc.material.opacity=0.4*Math.min(1,k*2.2);disc.scale.set(0.35+0.65*k,0.35+0.65*k,0.35+0.65*k);const p=1+0.04*Math.sin(k*22);ring.scale.set(p,p,p);inner.scale.set(p,p,p);runes.rotation.y=k*1.3;},()=>{G3.scene.remove(disc);G3.scene.remove(ring);G3.scene.remove(inner);G3.scene.remove(runes);});
}
function bt3dRainDrop(geo,colorHex,cx,cz,r,H,dur,delay,flip,trail){
 const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:new THREE.Color(colorHex),transparent:true}));
 if(flip)m.rotation.x=Math.PI;
 if(trail){const tm=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.55,0.035),new THREE.MeshBasicMaterial({color:new THREE.Color(trail),transparent:true,opacity:0.55}));tm.position.y=0.34;m.add(tm);}
 const a=Math.random()*6.28,rr=Math.sqrt(Math.random())*r;
 m.position.set(cx+Math.cos(a)*rr,H,cz+Math.sin(a)*rr);G3.scene.add(m);
 bt3dTween(dur,k=>{const kk=delay>=1?k:clamp((k-delay)/(1-delay),0,1);m.position.y=H*(1-kk);m.material.opacity=kk>=1?0:1;},()=>{G3.scene.remove(m);});
}
function bt3dSkillRain(type,cx,cz,r){
 if(type==='aoeSlow'){for(let i=0;i<36;i++)bt3dRainDrop(new THREE.ConeGeometry(0.09,0.55,5),pick(['#dff4ff','#aee6ff','#ffffff','#ffffff']),cx,cz,r,5.2,0.72,Math.random()*0.4,1);}
 else if(type==='aoe'){for(let i=0;i<12;i++)bt3dRainDrop(new THREE.SphereGeometry(0.16,8,6),pick(['#ffb62e','#ff9d45','#ff7a2a']),cx,cz,r,5.2,0.62,Math.random()*0.3,0,'#ffb62e');}
 else if(type==='frontAoe'){for(let i=0;i<8;i++)bt3dRainDrop(new THREE.SphereGeometry(0.18,7,6),'#c9a186',cx,cz,r,4.6,0.6,Math.random()*0.3);}
 else if(type==='dotAll'){for(let i=0;i<26;i++)bt3dRainDrop(new THREE.SphereGeometry(0.085,6,5),pick(['#b07dff','#8a5cff','#c07dff']),cx,cz,r,4.8,0.72,Math.random()*0.4);}
 else if(type==='aoeStun'){for(let i=0;i<5;i++){const a=Math.random()*6.28,rr=Math.sqrt(Math.random())*r;const tx=cx+Math.cos(a)*rr,tz=cz+Math.sin(a)*rr;
  setTimeout(()=>{if(!G3)return;let px=tx+(Math.random()-0.5)*0.5,pz=tz+(Math.random()-0.5)*0.5,py=5.2;
   for(let sgm=0;sgm<4;sgm++){const ny=5.2-(sgm+1)*1.3;const nx=sgm===3?tx:tx+(Math.random()-0.5)*0.55,nz=sgm===3?tz:tz+(Math.random()-0.5)*0.55;
    const len=Math.hypot(nx-px,ny-py,nz-pz);const seg=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,len),new THREE.MeshBasicMaterial({color:new THREE.Color('#fff6b0'),transparent:true}));
    seg.position.set((px+nx)/2,(py+ny)/2,(pz+nz)/2);seg.lookAt(nx,ny,nz);G3.scene.add(seg);
    bt3dTween(0.22,k=>{seg.material.opacity=k<0.25?k/0.25:1-(k-0.25)/0.75;},()=>{G3.scene.remove(seg);});
    px=nx;py=ny;pz=nz;}},i*85);}}
}
function bt3dUltEffect(u,ult){
 const foes=foesOf(u),allies=alliesOf(u);
 const ctr=arr=>arr.length?{x:arr.reduce((s,x)=>s+x.px,0)/arr.length,z:arr.reduce((s,x)=>s+x.pz,0)/arr.length}:{x:u.px,z:u.pz};
 switch(ult.type){
  case 'aoe':{const c=ctr(foes);bt3dRing(c.x,c.z,'#ff9d45',0.5,2.4);bt3dBurst(c.x,c.z,'#ffb62e',9);break;}
  case 'aoeStun':{const c=ctr(foes);bt3dRing(c.x,c.z,'#ffe14d',0.5,2.4);bt3dBurst(c.x,c.z,'#fff3a0',9);break;}
  case 'aoeSlow':{const c=ctr(foes);bt3dRing(c.x,c.z,'#7ad8ff',0.5,2.4);bt3dBurst(c.x,c.z,'#aee6ff',9);break;}
  case 'frontAoe':{const c=ctr(foes);bt3dRing(c.x,c.z,'#ff7a2a',0.5,2.0);bt3dBurst(c.x,c.z,'#ff9d45',8);break;}
  case 'dotAll':{const c=ctr(foes);bt3dRing(c.x,c.z,'#b07dff',0.55,2.4);bt3dBurst(c.x,c.z,'#c07dff',9);break;}
  case 'healAll':case 'hotAll':{allies.forEach(a=>bt3dBurst(a.px,a.pz,'#7ddb4a',5));const c=ctr(allies);bt3dRing(c.x,c.z,'#7ddb4a',0.5,2.2);break;}
  case 'shieldHeal':case 'tauntShield':{bt3dRing(u.px,u.pz,'#ffd100',0.5,1.8);bt3dBurst(u.px,u.pz,'#ffe9a8',7);break;}
  case 'snipe':case 'backstab':{const t=foes[0];if(t){bt3dRing(t.px,t.pz,'#ff5a4e',0.4,1.1);bt3dBurst(t.px,t.pz,'#ff8a7a',6);}break;}
  case 'revive':{bt3dRing(u.px,u.pz,'#fff3a0',0.6,2.0);bt3dBurst(u.px,u.pz,'#fff3a0',10);break;}
  default:bt3dBurst(u.px,u.pz,'#ffd76a',6);
 }
}
function bt3dProjectile(a,b,color){
 if(!a.g3||!b.g3)return;
 const m=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),new THREE.MeshBasicMaterial({color:new THREE.Color(color)}));
 const p0=new THREE.Vector3(a.g3.grp.position.x,1.15,a.g3.grp.position.z),p1=new THREE.Vector3(b.g3.grp.position.x,0.85,b.g3.grp.position.z);
 m.position.copy(p0);G3.scene.add(m);
 bt3dTween(0.17,k=>{m.position.lerpVectors(p0,p1,k);},()=>{G3.scene.remove(m);});
}
function bt3dFlash(u){if(!u.g3)return;u.g3.mats.forEach(m=>m.emissive.setHex(0x999999));setTimeout(()=>{if(u.g3)u.g3.mats.forEach(m=>m.emissive.setHex(m.userData.e0||0));},110);}
function bt3dDie(u){if(!u.g3)return;u.g3.dead=true;const spin=u.g3.spin;bt3dTween(0.45,k=>{spin.rotation.x=-1.35*k;},null,k=>1-Math.pow(1-k,2));}
function bt3dRevive(u){if(!u.g3)return;u.g3.dead=false;const spin=u.g3.spin;bt3dTween(0.4,k=>{spin.rotation.x=-1.35*(1-k);});}
function bt3dUltFx(u){if(!u.g3)return;const spin=u.g3.spin,grp=u.g3.grp,by=u.g3.baseY;
 bt3dTween(0.5,k=>{spin.rotation.y=Math.PI*2*k;grp.position.y=by+Math.sin(k*Math.PI)*0.5;},()=>{spin.rotation.y=0;grp.position.y=by;});}
function bt3dDispose(){
 if(!G3)return;
 cancelAnimationFrame(G3.raf);window.removeEventListener('resize',G3.onResize);
 try{G3.renderer.dispose();if(G3.renderer.domElement&&G3.renderer.domElement.parentNode)G3.renderer.domElement.parentNode.removeChild(G3.renderer.domElement);}catch(e){}
 G3=null;
}
/* ================= 启动 ================= */
loadGame();tickStamina();
renderTop();goScr('home');
if(!S.guide.battled){setTimeout(()=>toast('点任意关卡开始你的第一次战斗！'),700);}
setInterval(()=>{if(B&&!B.over)return;},1000);
</script>
